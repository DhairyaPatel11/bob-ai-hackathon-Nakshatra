submission:
  title: "ReadyLine — Mission Readiness & Predictive Maintenance Copilot" # REQUIRED

  problem_statement: >                                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Military aircraft, combat vehicles, and rotorcraft suffer from reduced mission capability rates due to rigid calendar-based maintenance that ignores actual equipment degradation and leaves high-frequency sensor and vibration (HUMS) telemetry unanalyzed. This drives $90B annually in DoD sustainment costs and persistent readiness declines (such as the F-35 mission-capable rate falling from 67% in FY21 to 44% in FY25), demonstrating 20 years of stalled progress under DoD Condition-Based Maintenance Plus (DoDI 4151.22 / GAO-23-105556).

  solution_summary: >                                  # REQUIRED — 1-3 sentences. What did you build?
    ReadyLine is a dual-modality predictive maintenance copilot that fuses turbofan thermodynamic sensors (NASA C-MAPSS) and drivetrain bearing vibration accelerometry (NASA IMS) into a unified readiness pipeline. It combines XGBoost regression with IBM Granite Time Series (TinyTimeMixer / TTM) zero-shot forecasting for Remaining Useful Life (RUL) estimation, generates physics-grounded natural-language briefings via local IBM Granite (Ollama) citing specific defect frequencies (BPFO/BPFI), and dynamically orchestrates a parts-availability-aware priority maintenance queue in an interactive Streamlit copilot.

  key_features:                                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Dual-modality mixed-fleet readiness evaluation assessing both turbofan aero-engines and gearbox mechanical transmissions under unified schema"
    - "IBM Granite Time Series (TinyTimeMixer / TTM r2) zero-shot sensor trend forecasting integrated directly into RUL degradation models"
    - "Physics-grounded maintenance briefings generated by local IBM Granite 3.3 LLM (via Ollama) citing characteristic defect frequencies (BPFO, BPFI, BSF, FTF)"
    - "Supply-chain-aware priority queue balancing RUL urgency, mission-critical status, scheduled maintenance deadlines, open discrepancies, and spare parts lead time"
    - "Interactive Streamlit fleet readiness copilot featuring natural language operator Q&A, drill-down sensor analytics, and flight-line triage actions"

  tech_stack:
    languages:
      - "Python"
    frameworks:
      - "Streamlit"
      - "XGBoost"
      - "scikit-learn"
      - "SciPy"
      - "Pandas"
      - "NumPy"
      - "PyArrow"
    ibm_technologies:
      - "IBM Bob"
      - "IBM Granite Time Series (TTM r2)"
      - "IBM Granite 3.3 2B (via Ollama)"
      - "watsonx.ai (architecture & API design)"
    databases:
      - "Apache Parquet"
    other:
      - "NASA C-MAPSS Turbofan Degradation Dataset (FD001)"
      - "NASA IMS Bearing Vibration Run-to-Failure Dataset (Rexnord ZA-2115)"
      - "Plotly"

  what_we_are_most_proud_of: >
    We are most proud of building a genuinely dual-modality platform running on real NASA run-to-failure datasets across aerodynamic and mechanical domains, rather than synthetic toys. Integrating IBM Granite Time Series (TTM) required real engineering rigor: discovering that the default 512-cycle TTM context window was fundamentally incompatible with turbine asset lifecycles, and identifying and deploying the fine-tuned 52-16 context/horizon branch to extract forward-looking degradation velocity. Combined with local Granite LLM execution for DDIL edge operational resilience, ReadyLine is designed for real military flight-line reality.

  known_limitations: >
    1) TTM zero-shot neural inference on 100 assets is computationally intensive on CPU, requiring an optional fast-path for constrained dev machines. 2) IBM Cloud account provisioning blocks (WSCPA0000E) necessitated running Granite 3.3 locally via Ollama rather than watsonx.ai cloud (though this architectural choice enhances contested/DDIL operational utility). 3) Service records and depot spare-parts inventory are synthesized using degradation-tier statistical correlation since live military ERP/CAMS databases are classified. 4) XGBoost point predictors are used for regression rather than probabilistic ensemble bounds.

